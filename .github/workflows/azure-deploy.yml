name: Build and deploy FlowMate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure browser-safe runtime settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MCP_ENDPOINT: ${{ vars.MCP_ENDPOINT }}
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
        run: |
          $settings = Get-Content -LiteralPath 'Web/wwwroot/appsettings.example.json' -Raw | ConvertFrom-Json -AsHashtable
          $settings['ApiBaseUrl'] = $env:API_BASE_URL
          $settings['McpEndpoint'] = $env:MCP_ENDPOINT
          $settings['Auth0']['Domain'] = $env:AUTH0_DOMAIN
          $settings['Auth0']['ClientId'] = $env:AUTH0_CLIENT_ID
          $settings['Auth0']['Audience'] = $env:AUTH0_AUDIENCE
          $settings | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'Web/wwwroot/appsettings.json' -Encoding utf8NoBOM

      - name: Publish Blazor WebAssembly
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Web/Web.csproj --configfile NuGet.config

          # Keep the source app under /frontend/ in Aspire. Prepare the deployment copy of index.html
          # before publish so compressed variants and .NET 10 fingerprinting use the deployed paths.
          $indexPath = 'Web/wwwroot/index.html'
          $index = Get-Content -LiteralPath $indexPath -Raw
          $frontendBase = '<base href="/frontend/" />'
          $blazorScript = '<script src="_framework/blazor.webassembly.js" autostart="false"></script>'
          
          if (-not $index.Contains($frontendBase) -or -not $index.Contains($blazorScript)) {
            throw "Expected the Aspire base path and Blazor script tag in $indexPath before publishing."
          }
          
          $index = $index.Replace($frontendBase, '<base href="/" />')
          $index = $index.Replace($blazorScript, '<script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>')
          if (-not $index.Contains('<script type="importmap"></script>')) {
            if (-not $index.Contains('</head>')) {
              throw "Expected a closing head tag in $indexPath before publishing."
            }
            $index = $index.Replace('</head>', ('    <script type="importmap"></script>' + [Environment]::NewLine + '</head>'))
          }
          $index | Set-Content -LiteralPath $indexPath -Encoding utf8NoBOM

          dotnet publish Web/Web.csproj -c Release --no-restore -o artifacts/web-publish
          $publishedIndexPath = 'artifacts/web-publish/wwwroot/index.html'
          $publishedIndex = Get-Content -LiteralPath $publishedIndexPath -Raw
          $loaderName = [regex]::Match($publishedIndex, '_framework/(blazor[.]webassembly[.][^" ]+[.]js)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($loaderName) -or -not (Test-Path -LiteralPath "artifacts/web-publish/wwwroot/_framework/$loaderName")) {
            throw 'Published index.html does not reference an existing fingerprinted Blazor WebAssembly loader.'
          }
          if (-not $publishedIndex.Contains('<script type="importmap">')) {
            throw 'Published index.html is missing the import map required by fingerprinted .NET 10 assets.'
          }
          New-Item -ItemType Directory -Path 'artifacts/web' -Force | Out-Null
          Get-ChildItem -LiteralPath 'artifacts/web-publish/wwwroot' -Force | Copy-Item -Destination 'artifacts/web' -Recurse -Force

      - name: Publish Azure Functions API
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore API/API.csproj --configfile NuGet.config
          dotnet publish API/API.csproj -c Release --no-restore -o artifacts/api

      - name: Publish Azure Functions MCP server
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore MCP/MCP.csproj --configfile NuGet.config
          dotnet publish MCP/MCP.csproj -c Release --no-restore -o artifacts/mcp

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/web

      - uses: actions/upload-artifact@v4
        with:
          name: functions-api
          path: artifacts/api
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: functions-mcp
          path: artifacts/mcp

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts/web

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/web
          skip_app_build: true

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-api
          path: artifacts/api

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: artifacts/api
          sku: flexconsumption
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

