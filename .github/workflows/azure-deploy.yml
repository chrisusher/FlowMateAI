name: Build and deploy FlowMate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment; Production is a manual release.
        type: choice
        required: true
        options: [Test, Production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Test' }}
    env:
      KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
      KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'flowmate' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify Keycloak realm before publishing the application
        run: |
          test -n "$KEYCLOAK_URL" || { echo 'KEYCLOAK_URL must point to the deployed Keycloak environment.' >&2; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["KEYCLOAK_URL"].rstrip("/")
          realm = os.environ["KEYCLOAK_REALM"]
          with urllib.request.urlopen(f"{url}/realms/{realm}/.well-known/openid-configuration", timeout=20) as response:
              metadata = json.load(response)
          expected = f"{url}/realms/{realm}"
          if metadata.get("issuer") != expected:
              raise SystemExit(f"Keycloak issuer mismatch: expected {expected!r}, received {metadata.get('issuer')!r}")
          PY
      - name: Configure browser-safe runtime settings
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          MCP_ENDPOINT: ${{ vars.MCP_ENDPOINT }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
        run: |
          python - <<'PY'
          import json, os
          path = "Web/wwwroot/appsettings.json"
          with open(path, encoding="utf-8") as source:
              settings = json.load(source)
          settings["ApiBaseUrl"] = os.environ["API_BASE_URL"]
          settings["McpEndpoint"] = os.environ["MCP_ENDPOINT"]
          settings["Keycloak"]["Url"] = os.environ["KEYCLOAK_URL"]
          settings["Keycloak"]["Realm"] = os.environ.get("KEYCLOAK_REALM", "flowmate")
          settings["Keycloak"]["ClientId"] = os.environ.get("KEYCLOAK_CLIENT_ID", "flowmate-web")
          with open(path, "w", encoding="utf-8") as destination:
              json.dump(settings, destination, indent=2)
          PY
      - name: Publish Blazor WebAssembly
        run: |
          dotnet restore Web/Web.csproj --configfile NuGet.config
          dotnet publish Web/Web.csproj -c Release --no-restore -o artifacts/web-publish
          mkdir -p artifacts/web
          cp -a artifacts/web-publish/wwwroot/. artifacts/web/
          sed -i 's|<base href="/frontend/" />|<base href="/" />|' artifacts/web/index.html
      - name: Publish Azure Functions API
        run: |
          dotnet restore API/API.csproj --configfile NuGet.config
          dotnet publish API/API.csproj -c Release --no-restore -o artifacts/api
      - name: Publish Azure Functions MCP server
        run: |
          dotnet restore MCP/MCP.csproj --configfile NuGet.config
          dotnet publish MCP/MCP.csproj -c Release --no-restore -o artifacts/mcp
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: functions-api
          path: artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: functions-mcp
          path: artifacts/mcp

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Test' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts/web
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/web
          skip_app_build: true

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Test' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-api
          path: artifacts/api
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: artifacts/api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          app-settings: >-
            Authentication__Authority=${{ vars.KEYCLOAK_URL }}/realms/${{ vars.KEYCLOAK_REALM || 'flowmate' }}
            Authentication__Audience=flowmate-api
            Cors__AllowedOrigins__0=${{ vars.FLOWMATE_FRONTEND_ORIGIN }}

  deploy-mcp:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'Test' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-mcp
          path: artifacts/mcp
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_MCP_FUNCTIONAPP_NAME }}
          package: artifacts/mcp
          publish-profile: ${{ secrets.AZURE_MCP_FUNCTIONAPP_PUBLISH_PROFILE }}
