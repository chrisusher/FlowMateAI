openapi: 3.0.3
info:
  title: FlowMate API
  version: 0.1.0
  description: HTTP API for FlowMate workspaces, coaching, billing, and health. The static app shell can load publicly; protected UI routes and API operations require an Auth0 access token. Only health and the Stripe signature-verified webhook are public.
servers:
  - url: /api
    description: Azure Functions HTTP route prefix
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      responses:
        '200':
          description: The API is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: Get the signed-in user's workspace
      security:
        - bearerAuth: []
      parameters:
        - name: collections
          in: query
          required: false
          schema:
            type: string
            enum: [separate]
          description: Return workspace metadata and collection hashes for validating separate collection reads. Omit to return the complete snapshot.
      responses:
        '200':
          description: Workspace and current revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Workspace-Collections:
              description: Set to separate when the response is a collection manifest.
              schema:
                type: string
                enum: [separate]
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/WorkspaceResponse'
                  - $ref: '#/components/schemas/WorkspaceCollectionManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: saveWorkspace
      summary: Save the signed-in user's workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceSaveRequest'
      responses:
        '200':
          description: Workspace saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The workspace exceeds the current plan's project limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The workspace revision conflicts with the latest saved revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/projects:
    get:
      operationId: listProjects
      summary: List the signed-in user's projects
      description: Reads project documents after account cutover; legacy accounts use the workspace until migrated.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Records in workspace order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, color, createdAt]
              properties:
                id: { type: string }
                name: { type: string, maxLength: 80 }
                color: { type: string, example: '#5b68e8' }
                createdAt: { type: string, format: date-time }
      responses:
        '201':
          description: Project and record revision. Reuse the same ID and request on retry.
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Active project limit reached }
        '409': { description: Conflicting project or slot reservation }
        '503': { description: Project storage has not been cut over }
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get one of the signed-in user's projects
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested record.
          headers:
            ETag:
              description: Project record revision after cutover.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The record was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: renameProject
      summary: Rename a project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, revision]
              properties:
                name: { type: string, maxLength: 80 }
                revision: { type: string }
      responses:
        '200': { description: Updated project and record revision }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Project not found }
        '409': { description: Stale revision or unavailable project }
        '503': { description: Project storage has not been cut over }
  /v1/projects/{id}/archive:
    post:
      operationId: archiveProject
      summary: Archive a project and clear any idle timer selection
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, workspaceRevision]
              properties:
                revision: { type: string }
                workspaceRevision: { type: string }
      responses:
        '200': { description: Archived project, project revision, workspace revision and timer }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Project not found }
        '409': { description: Stale revision or active timer }
        '503': { description: Project storage has not been cut over }
  /v1/projects/{id}/restore:
    post:
      operationId: restoreProject
      summary: Restore an archived project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: string }
      responses:
        '200': { description: Restored project and record revision }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Active project limit reached }
        '404': { description: Project not found }
        '409': { description: Stale revision or unavailable project }
        '503': { description: Project storage has not been cut over }
  /v1/tasks:
    get:
      operationId: listTasks
      summary: List the signed-in user's tasks
      description: Reads authoritative task documents after account cutover; legacy accounts read the workspace.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Records in workspace order }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTask
      summary: Create a task in an active project
      description: Reuse the same task ID on retry. Reload after an uncertain response before changing the workspace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWriteRequest' }
      responses:
        '201': { description: Task, record revision, workspace revision and timer }
        '400': { description: Invalid task or capacity reached }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Conflicting ID, project or workspace revision }
        '503': { description: Task storage has not been cut over }
  /v1/tasks/bulk:
    post:
      operationId: bulkUpdateTasks
      summary: Apply up to 100 distinct task changes
      description: Returns a result or error for each task; successful records are not rolled back when another record fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/TaskWriteRequest' }
      responses:
        '200': { description: Per-record outcomes }
        '400': { description: Invalid batch }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTask
      summary: Get one of the signed-in user's tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested record; ETag is the record revision after cutover.
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Record not found }
    put:
      operationId: updateTask
      summary: Edit, move, complete, reopen, plan or unplan a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWriteRequest' }
      responses:
        '200': { description: Updated task and record revision; moves also return workspace revision and timer }
        '400': { description: Invalid task }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Task not found }
        '409': { description: Stale revision, unavailable project or active timer }
        '503': { description: Task storage has not been cut over }
    delete:
      operationId: deleteTask
      summary: Remove a task while retaining focus history
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWriteRequest' }
      responses:
        '200': { description: Removed task, record revision, workspace revision and timer }
        '400': { description: Invalid revision }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Task not found }
        '409': { description: Stale revision or active timer }
        '503': { description: Task storage has not been cut over }
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in user's sessions
      description: Reads the collection container, which is synchronised when the workspace is saved. Existing accounts may need migration.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Records in workspace order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Get one of the signed-in user's sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The record was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/conversations:
    get:
      operationId: listConversations
      summary: List the signed-in user's conversations
      description: Reads the collection container, which is synchronised when the workspace is saved. Existing accounts may need migration.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Records in workspace order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/conversations/{id}:
    get:
      operationId: getConversation
      summary: Get one of the signed-in user's conversations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The record was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/coach:
    post:
      operationId: askCoach
      summary: Send a message to the focus coach
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachRequest'
      responses:
        '200':
          description: Coach response and updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Workspace changed while the conversation was being saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Monthly coach prompt limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Focus coach is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/billing/prices:
    get:
      operationId: getBillingPrices
      summary: List available billing prices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available subscription prices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillingPrice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Billing provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/billing:
    get:
      operationId: getBillingSummary
      summary: Get the signed-in user's billing summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/trial:
    post:
      operationId: startBillingTrial
      summary: Start a billing trial
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/BillingAction'
        '400':
          $ref: '#/components/responses/BillingAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      summary: Create a subscription checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/BillingAction'
        '400':
          $ref: '#/components/responses/BillingAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/billing/portal:
    post:
      operationId: createBillingPortal
      summary: Create a billing portal session
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/BillingAction'
        '400':
          $ref: '#/components/responses/BillingAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account:
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated user's account
      description: Cancels the Stripe subscription before deleting application data and the Auth0 identity. The request requires the authenticated email and the exact confirmation phrase.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account and application data deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The subscription could not be cancelled, so no application data was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Deletion is incomplete and can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      summary: Receive a Stripe webhook event
      parameters:
        - name: Stripe-Signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook accepted.
        '400':
          description: Webhook signature or payload is invalid.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    ETag:
      description: Revision token for the current workspace.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: A valid access token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BillingAction:
      description: Billing operation result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingActionResponse'
  schemas:
    TaskWriteRequest:
      type: object
      description: Supply task for create and update, its ETag revision for update and delete, and the workspace revision for create, move and delete.
      properties:
        task:
          type: object
          required: [id, title, projectId, priority, isComplete, plannedToday, focusMinutesToday, createdAt]
          properties:
            id: { type: string, maxLength: 128 }
            title: { type: string, maxLength: 160 }
            projectId: { type: string, maxLength: 128 }
            dueDate: { type: string, format: date, nullable: true }
            priority: { type: string }
            isComplete: { type: boolean }
            plannedToday: { type: boolean }
            focusMinutesToday: { type: integer }
            createdAt: { type: string, format: date-time }
        revision: { type: string }
        workspaceRevision: { type: string }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    BillingActionResponse:
      type: object
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
        url:
          type: string
          format: uri
          nullable: true
        code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
    BillingPrice:
      type: object
      required: [interval, currency, unitAmount, display]
      properties:
        interval:
          type: string
        currency:
          type: string
        unitAmount:
          type: integer
          format: int64
        display:
          type: string
    BillingSummary:
      type: object
      required: [plan, status, trialUsed, cancelAtPeriodEnd, isManualGrant, promptsUsed, promptLimit]
      properties:
        plan:
          type: string
        status:
          type: string
        trialUsed:
          type: boolean
        periodEndsAt:
          type: string
          format: date-time
          nullable: true
        subscriptionInterval:
          type: string
          enum: [month, year]
          nullable: true
          description: Confirmed subscription renewal interval from Stripe; null when not yet known.
        isManualGrant:
          type: boolean
          description: True when Pro access was granted manually for preview and has no Stripe subscription or automatic renewal.
        cancelAtPeriodEnd:
          type: boolean
          description: True when Stripe has scheduled the subscription to end at the current period boundary.
        promptsUsed:
          type: integer
        promptLimit:
          type: integer
    CheckoutRequest:
      type: object
      required: [annual]
      properties:
        annual:
          type: boolean
    AccountDeletionRequest:
      type: object
      required: [confirmation, email]
      properties:
        confirmation:
          type: string
          example: DELETE MY ACCOUNT
        email:
          type: string
          format: email
    CoachRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          maxLength: 4000
        conversationId:
          type: string
          nullable: true
    CoachResponse:
      type: object
      required: [conversation, revision, promptsUsed, promptLimit]
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationRecord'
        revision:
          type: string
        promptsUsed:
          type: integer
        promptLimit:
          type: integer
    ConversationRecord:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageRecord'
        updatedAt:
          type: string
          format: date-time
    ChatMessageRecord:
      type: object
      properties:
        role:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkspaceSaveRequest:
      type: object
      required: [workspace]
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceSnapshot'
        revision:
          type: string
          nullable: true
    WorkspaceResponse:
      type: object
      required: [workspace, revision]
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceSnapshot'
        revision:
          type: string
    WorkspaceCollectionManifest:
      description: SHA-256 hashes of the ordered collections serialised with the shared JSON options; a mismatch requires a fresh complete workspace read.
      type: object
      required: [workspace, revision, projectsHash, tasksHash, sessionsHash, conversationsHash]
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceSnapshot'
        revision:
          type: string
        projectsHash:
          type: string
        tasksHash:
          type: string
        sessionsHash:
          type: string
        conversationsHash:
          type: string
    WorkspaceSnapshot:
      type: object
      properties:
        displayName:
          type: string
        timeZone:
          type: string
        plan:
          type: string
        clientId:
          type: string
        muted:
          type: boolean
        projects:
          type: array
          items:
            type: object
            additionalProperties: true
        tasks:
          type: array
          items:
            type: object
            additionalProperties: true
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        timer:
          type: object
          additionalProperties: true
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationRecord'
